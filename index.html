<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌸 Planning Maman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { background: #FFF8F3; font-family: 'Nunito', sans-serif; }
    button:active { transform: scale(0.97); }
    select { outline: none; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes slideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .toast-in { animation: slideUp 0.25s ease; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- React 18 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel (JSX in browser) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script type="text/babel">

// ════════════════════════════════════════════════════════════
//  🔥 ÉTAPE FIREBASE — Coller votre config ici
//     (laisser vide = mode test local, données non partagées)
// ════════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey:            "",   // ← coller ici
  authDomain:        "",
  projectId:         "",
  storageBucket:     "",
  messagingSenderId: "",
  appId:             ""
};

// ════════════════════════════════════════════════════════════
//  CONFIGURATION FAMILLE
// ════════════════════════════════════════════════════════════
const PEOPLE = [
  { name: "Badia",      color: "#E07A4F", bg: "#FBF0EB", role: "principale"  },
  { name: "Abdelilah", color: "#3A82C3", bg: "#EBF3FB", role: "principal"   },
  { name: "Amina",     color: "#2BA06A", bg: "#E8F7F0", role: "principale"  },
  { name: "Naïma",     color: "#8B5BAF", bg: "#F3EEF8", role: "principale"  },
  { name: "Souad",     color: "#C94B6A", bg: "#FBECF0", role: "principale"  },
  { name: "Touria",    color: "#B08A10", bg: "#F8F3E8", role: "remplaçante" },
  { name: "Mohamed",   color: "#2498A0", bg: "#E8F5F7", role: "remplaçant"  },
];

const WEEKDAYS_S = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const WEEKDAYS_F = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MONTHS_FR  = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

// ════════════════════════════════════════════════════════════
//  COUCHE STOCKAGE
// ════════════════════════════════════════════════════════════
const USE_FIREBASE = FIREBASE_CONFIG.apiKey !== "";
let db = null;
if (USE_FIREBASE) {
  try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }
  catch(e) { console.error("Firebase init failed:", e); }
}

const safeGet = async (key) => {
  if (USE_FIREBASE && db) {
    try { const d = await db.collection("maman").doc(key).get(); return d.exists ? d.data().val : null; }
    catch { return null; }
  }
  try { const v = localStorage.getItem("maman_" + key); return v ? JSON.parse(v) : null; }
  catch { return null; }
};

const safeSet = async (key, val) => {
  if (USE_FIREBASE && db) {
    try {
      await db.collection("maman").doc(key).set({ val, ts: firebase.firestore.FieldValue.serverTimestamp() });
      return true;
    } catch(e) { console.error(e); return false; }
  }
  try { localStorage.setItem("maman_" + key, JSON.stringify(val)); return true; }
  catch { return false; }
};

const onLive = (key, cb) => {
  if (!USE_FIREBASE || !db) return () => {};
  return db.collection("maman").doc(key).onSnapshot(d => { if (d.exists) cb(d.data().val); });
};

const KEYS = {
  plan:      (y,m) => `plan-${y}-${m}`,
  indispo:   (y,m) => `indispo-${y}-${m}`,
  exchanges: ()    => `echanges-v3`,
  template:  ()    => `template-v1`,
};

// ════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════
const { useState, useEffect, useCallback, useRef } = React;

const daysInMonth   = (y,m) => new Date(y, m+1, 0).getDate();
const firstWeekday  = (y,m) => { const d = new Date(y,m,1).getDay(); return d===0?6:d-1; };
const personFor     = (n)   => PEOPLE.find(p => p.name === n);
const genId         = ()    => `${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
const shortDate     = (d,m) => `${d} ${MONTHS_FR[m]}`;
const fullDate      = (d,m,y) => {
  const wd = new Date(y,m,d).getDay(); return `${WEEKDAYS_F[wd===0?6:wd-1]} ${d} ${MONTHS_FR[m]}`;
};

// ════════════════════════════════════════════════════════════
//  COMPOSANT PRINCIPAL
// ════════════════════════════════════════════════════════════
function App() {
  const now = new Date();
  const [year,       setYear]       = useState(now.getFullYear());
  const [month,      setMonth]      = useState(now.getMonth());
  const [planning,   setPlanning]   = useState({});
  const [indispo,    setIndispo]    = useState({});
  const [exchanges,  setExchanges]  = useState([]);
  const [template,   setTemplate]   = useState({});
  const [view,       setView]       = useState("calendar");
  const [selDay,     setSelDay]     = useState(null);
  const [sheetOpen,  setSheetOpen]  = useState(false);
  const [toast,      setToast]      = useState(null);
  const [confirm,    setConfirm]    = useState(null);
  const [syncing,    setSyncing]    = useState(false);
  const [lastSync,   setLastSync]   = useState(null);
  const toastRef = useRef(null);

  // ── Toast ─────────────────────────────────────────────────
  const showToast = useCallback((msg, type="success") => {
    setToast({msg, type});
    if (toastRef.current) clearTimeout(toastRef.current);
    toastRef.current = setTimeout(() => setToast(null), 2800);
  }, []);
  const showConfirm = useCallback((msg, fn) => setConfirm({msg, fn}), []);

  // ── Chargement ────────────────────────────────────────────
  const loadData = useCallback(async () => {
    setSyncing(true);
    const [p,i,e,t] = await Promise.all([
      safeGet(KEYS.plan(year,month)),
      safeGet(KEYS.indispo(year,month)),
      safeGet(KEYS.exchanges()),
      safeGet(KEYS.template()),
    ]);
    setPlanning(p||{}); setIndispo(i||{}); setExchanges(e||[]); setTemplate(t||{});
    setLastSync(new Date()); setSyncing(false);
  }, [year, month]);

  // Polling si pas Firebase, onSnapshot si Firebase
  useEffect(() => {
    loadData();
    if (USE_FIREBASE) {
      const u1 = onLive(KEYS.plan(year,month),     v => { if(v) setPlanning(v); });
      const u2 = onLive(KEYS.indispo(year,month),  v => { if(v) setIndispo(v); });
      const u3 = onLive(KEYS.exchanges(),          v => { if(v) setExchanges(v); });
      const u4 = onLive(KEYS.template(),           v => { if(v) setTemplate(v); });
      return () => { u1(); u2(); u3(); u4(); };
    } else {
      const iv = setInterval(loadData, 15000);
      return () => clearInterval(iv);
    }
  }, [loadData]);

  // ── Actions ───────────────────────────────────────────────
  const assignDay = async (day, name) => {
    const next = {...planning, [day]: name};
    setPlanning(next); await safeSet(KEYS.plan(year,month), next);
    showToast(`✅ ${name} — ${shortDate(day,month)}`);
  };
  const clearDay = async (day) => {
    const next = {...planning}; delete next[day];
    setPlanning(next); await safeSet(KEYS.plan(year,month), next);
    showToast("Journée effacée", "info");
  };
  const toggleIndispo = async (day, name) => {
    const cur = indispo[day]||[];
    const next = cur.includes(name) ? cur.filter(n=>n!==name) : [...cur,name];
    const obj = {...indispo};
    if (next.length===0) delete obj[day]; else obj[day]=next;
    setIndispo(obj); await safeSet(KEYS.indispo(year,month), obj);
  };
  const proposeExchange = async (day) => {
    const from = planning[day]; if (!from) return;
    if (exchanges.some(e=>e.day===day&&e.month===month&&e.year===year&&e.status==="open")) {
      showToast("Échange déjà proposé", "info"); return;
    }
    const next = [...exchanges, {id:genId(), from, day, month, year, status:"open", at:Date.now()}];
    setExchanges(next); await safeSet(KEYS.exchanges(), next);
    showToast("🔄 Demande d'échange envoyée !"); setSheetOpen(false);
  };
  const acceptExchange = async (id, by) => {
    const ex = exchanges.find(e=>e.id===id);
    if (!ex||ex.status!=="open") { showToast("Échange non disponible","error"); await loadData(); return; }
    const nextEx   = exchanges.map(e=>e.id===id?{...e,status:"accepted",by}:e);
    const nextPlan = {...planning, [ex.day]:by};
    setExchanges(nextEx); setPlanning(nextPlan);
    await Promise.all([safeSet(KEYS.exchanges(),nextEx), safeSet(KEYS.plan(ex.year,ex.month),nextPlan)]);
    showToast(`✅ ${by} prend le ${shortDate(ex.day,ex.month)} !`);
  };
  const cancelExchange = async (id) => {
    const next = exchanges.filter(e=>e.id!==id);
    setExchanges(next); await safeSet(KEYS.exchanges(), next);
    showToast("Demande annulée","info");
  };
  const saveTemplate = async (tpl) => {
    setTemplate(tpl); await safeSet(KEYS.template(), tpl);
  };
  const applyTemplate = async (overwrite) => {
    const total = daysInMonth(year,month);
    const next = overwrite ? {} : {...planning};
    for (let d=1; d<=total; d++) {
      const wd = new Date(year,month,d).getDay(); const idx = wd===0?6:wd-1;
      if (template[idx] && (overwrite||!next[d])) next[d]=template[idx];
    }
    setPlanning(next); await safeSet(KEYS.plan(year,month), next);
    showToast("✅ Modèle appliqué !");
  };

  const prevMonth = () => { if(month===0){setYear(y=>y-1);setMonth(11);}else setMonth(m=>m-1); };
  const nextMonth = () => { if(month===11){setYear(y=>y+1);setMonth(0);}else setMonth(m=>m+1); };

  // ════════════════════════════════════════════════════════
  //  VUE — CALENDRIER
  // ════════════════════════════════════════════════════════
  const CalendarView = () => {
    const today = new Date();
    const isCurr = today.getFullYear()===year && today.getMonth()===month;
    const total  = daysInMonth(year,month);
    const firstWd = firstWeekday(year,month);
    const planned = Object.keys(planning).length;
    const cells = [];
    for (let i=0; i<firstWd; i++) cells.push(<div key={`e${i}`}/>);
    for (let d=1; d<=total; d++) {
      const isToday = isCurr && d===today.getDate();
      const isPast  = isCurr ? d<today.getDate() : (year<today.getFullYear()||(year===today.getFullYear()&&month<today.getMonth()));
      const p = planning[d] ? personFor(planning[d]) : null;
      const hasEx = exchanges.some(e=>e.day===d&&e.month===month&&e.year===year&&e.status==="open");
      const hasIn = (indispo[d]||[]).length>0;
      cells.push(
        <div key={d}
          onClick={()=>{setSelDay(d);setSheetOpen(true);}}
          role="button" tabIndex={0}
          aria-label={`${fullDate(d,month,year)}${p?`, ${p.name}`:""}`}
          style={{aspectRatio:"1",borderRadius:10,display:"flex",flexDirection:"column",alignItems:"center",
            justifyContent:"center",cursor:"pointer",minHeight:44,padding:"3px 1px",gap:2,
            background:isToday?"#2D1B0E":p?"#FFFFFF":"#F5EDE5",
            border:`1.5px solid ${isToday?"transparent":p?p.color+"40":"#EDE6DE"}`,
            opacity:isPast&&!isToday?0.42:1,
            boxShadow:p&&!isToday?`0 1px 4px ${p.color}20`:"none",
            transition:"transform 0.1s"}}
        >
          <span style={{fontSize:13,fontWeight:isToday?800:500,color:isToday?"#FFF":"#333",lineHeight:1}}>{d}</span>
          {p && <div style={{width:9,height:9,borderRadius:"50%",background:isToday?"#FFF":p.color}}/>}
          {(hasEx||hasIn) && <div style={{fontSize:7,display:"flex",gap:1}}>{hasEx&&"🔄"}{hasIn&&"⚠️"}</div>}
        </div>
      );
    }
    return (
      <div>
        <div style={{margin:"8px 12px 0",background:"#FFF",borderRadius:12,padding:"10px 14px",border:"1px solid #EDE6DE",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:14,fontWeight:600,color:"#555"}}>{planned}/{total} jours planifiés</span>
          {total-planned>0
            ? <span style={{fontSize:13,color:"#C07000",fontWeight:700}}>⚠️ {total-planned} sans gardien</span>
            : <span style={{fontSize:13,color:"#2BA06A",fontWeight:700}}>✅ Tout couvert</span>
          }
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,padding:"8px 8px 0"}}>
          {WEEKDAYS_S.map(d=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"#BBB",padding:"4px 0",letterSpacing:0.3}}>{d}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,padding:"0 8px 8px"}}>
          {cells}
        </div>
        <div style={{padding:"0 12px 16px",display:"flex",flexWrap:"wrap",gap:6}}>
          {PEOPLE.map(p=>{
            const cnt = Object.values(planning).filter(n=>n===p.name).length;
            return (
              <div key={p.name} style={{display:"flex",alignItems:"center",gap:5,background:cnt>0?p.bg:"#F5EDE5",borderRadius:20,padding:"5px 10px",border:`1px solid ${cnt>0?p.color+"50":"#EDE6DE"}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:p.color}}/>
                <span style={{fontSize:13,fontWeight:600,color:cnt>0?p.color:"#999"}}>{p.name}</span>
                {cnt>0&&<span style={{fontSize:11,color:p.color,fontWeight:800}}>{cnt}j</span>}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // ════════════════════════════════════════════════════════
  //  VUE — RÉPARTITION
  // ════════════════════════════════════════════════════════
  const StatsView = () => {
    const total   = daysInMonth(year,month);
    const planned = Object.keys(planning).length;
    const eq      = 100/PEOPLE.length;
    const stats = PEOPLE.map(p=>{
      const cnt = Object.values(planning).filter(n=>n===p.name).length;
      const pct = planned>0?(cnt/planned)*100:0;
      return {...p, cnt, pct, diff:pct-eq};
    }).sort((a,b)=>b.cnt-a.cnt);
    return (
      <div style={{padding:"12px 12px 16px"}}>
        <div style={{background:planned<total?"#FFFBF0":"#F0FAF5",borderRadius:14,padding:"12px 14px",marginBottom:12,border:`1px solid ${planned<total?"#F0D060":"#90D8B0"}`}}>
          <div style={{fontSize:17,fontWeight:800,color:"#2D1B0E"}}>{planned} / {total} jours planifiés</div>
          <div style={{fontSize:13,fontWeight:600,marginTop:4,color:planned<total?"#B07800":"#2BA06A"}}>
            {planned<total?`⚠️ ${total-planned} jour${total-planned>1?"s":""} sans gardien`:"✅ Tous les jours sont couverts"}
          </div>
        </div>
        {stats.map(p=>(
          <div key={p.name} style={{background:"#FFF",borderRadius:14,padding:"12px 14px",marginBottom:8,border:`1px solid ${p.cnt>0?p.color+"30":"#EDE6DE"}`}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:14,height:14,borderRadius:"50%",background:p.color}}/>
                <span style={{fontSize:16,fontWeight:700,color:"#2D1B0E"}}>{p.name}</span>
                <span style={{fontSize:11,color:"#BBB",background:"#F5EDE5",borderRadius:8,padding:"2px 6px"}}>{p.role}</span>
              </div>
              <span style={{fontSize:22,fontWeight:900,color:p.cnt>0?p.color:"#CCC"}}>{p.cnt}<span style={{fontSize:13,color:"#AAA",fontWeight:400}}> j</span></span>
            </div>
            <div style={{height:8,borderRadius:4,background:"#F0EBE5",overflow:"hidden",margin:"8px 0 4px"}}>
              <div style={{height:"100%",width:`${Math.min(p.pct,100)}%`,background:p.color,borderRadius:4,transition:"width 0.5s ease"}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:12,color:"#AAA"}}>{Math.round(p.pct)}% des jours</span>
              {p.cnt>0&&Math.abs(p.diff)>3&&<span style={{fontSize:12,fontWeight:700,color:p.diff>5?"#D93025":"#2BA06A"}}>{p.diff>0?"+":""}{Math.round(p.diff)}% vs équitable</span>}
            </div>
          </div>
        ))}
      </div>
    );
  };

  // ════════════════════════════════════════════════════════
  //  VUE — ÉCHANGES
  // ════════════════════════════════════════════════════════
  const ExchangesView = () => {
    const open = exchanges.filter(e=>e.status==="open");
    if (!open.length) return (
      <div style={{textAlign:"center",padding:"60px 24px"}}>
        <div style={{fontSize:52,marginBottom:14}}>🤝</div>
        <div style={{fontSize:18,fontWeight:800,color:"#2D1B0E"}}>Aucun échange en cours</div>
        <div style={{fontSize:15,color:"#AAA",marginTop:8,lineHeight:1.6}}>
          Appuyez sur un jour du calendrier<br/>puis "Proposer un échange"
        </div>
      </div>
    );
    return (
      <div style={{padding:"12px 12px 16px"}}>
        {open.map(ex=>{
          const p = personFor(ex.from);
          return (
            <div key={ex.id} style={{background:"#FFF",border:`1px solid ${p?.color||"#EDE6DE"}40`,borderRadius:16,padding:14,marginBottom:12}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                <div style={{width:12,height:12,borderRadius:"50%",background:p?.color}}/>
                <span style={{fontSize:16,fontWeight:800,color:"#2D1B0E"}}>{ex.from}</span>
                <span style={{fontSize:14,color:"#666"}}>cherche un remplaçant</span>
              </div>
              <div style={{background:"#F5EDE5",borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:16,fontWeight:600,color:"#444"}}>
                📅 {fullDate(ex.day,ex.month,ex.year)}
              </div>
              <div style={{fontSize:13,fontWeight:700,color:"#BBB",marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>Qui peut prendre ce jour ?</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                {PEOPLE.filter(pe=>pe.name!==ex.from).map(pe=>(
                  <button key={pe.name}
                    onClick={()=>showConfirm(`${pe.name} prend le ${ex.day} ${MONTHS_FR[ex.month]} à la place de ${ex.from} ?`,()=>acceptExchange(ex.id,pe.name))}
                    style={{padding:"12px 8px",borderRadius:12,border:`1.5px solid ${pe.color}50`,background:pe.bg,color:pe.color,fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}
                  >{pe.name}</button>
                ))}
              </div>
              <button
                onClick={()=>showConfirm("Annuler cette demande d'échange ?",()=>cancelExchange(ex.id))}
                style={{width:"100%",marginTop:10,padding:"11px",borderRadius:10,border:"1px solid #EEE",background:"#FFF5F5",color:"#D93025",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}
              >Annuler la demande</button>
            </div>
          );
        })}
      </div>
    );
  };

  // ════════════════════════════════════════════════════════
  //  VUE — MODÈLE DE SEMAINE
  // ════════════════════════════════════════════════════════
  const TemplateView = () => {
    const handle = async (idx, val) => {
      const next = {...template};
      if (val) next[idx]=val; else delete next[idx];
      await saveTemplate(next);
    };
    return (
      <div style={{padding:"12px 12px 16px"}}>
        <div style={{background:"#FFF8F0",border:"1px solid #F0D8C0",borderRadius:14,padding:"12px 14px",marginBottom:14}}>
          <div style={{fontSize:16,fontWeight:800,color:"#2D1B0E",marginBottom:6}}>📅 Modèle de semaine</div>
          <div style={{fontSize:14,color:"#888",lineHeight:1.6}}>Définissez qui garde Maman chaque jour par défaut, puis appliquez au mois en un tap.</div>
        </div>
        <div style={{background:"#FFF",borderRadius:14,padding:"4px 14px",border:"1px solid #EDE6DE",marginBottom:14}}>
          {WEEKDAYS_F.map((wd,idx)=>{
            const assigned = template[idx]; const p = assigned?personFor(assigned):null;
            return (
              <div key={idx} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:idx<6?"1px solid #F5EDE5":"none"}}>
                <span style={{fontSize:15,fontWeight:700,color:"#2D1B0E",width:95,flexShrink:0}}>{wd}</span>
                <div style={{flex:1,position:"relative"}}>
                  {p&&<div style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",width:10,height:10,borderRadius:"50%",background:p.color,pointerEvents:"none",zIndex:1}}/>}
                  <select value={assigned||""} onChange={e=>handle(idx,e.target.value)}
                    style={{width:"100%",padding:`9px 12px 9px ${p?"28px":"12px"}`,borderRadius:10,border:`2px solid ${p?p.color+"60":"#E0D8D0"}`,background:p?p.bg:"#F5EDE5",fontSize:15,fontWeight:600,color:p?p.color:"#888",fontFamily:"inherit",appearance:"none",WebkitAppearance:"none",cursor:"pointer"}}
                  >
                    <option value="">— Personne —</option>
                    {PEOPLE.map(pe=><option key={pe.name} value={pe.name}>{pe.name}</option>)}
                  </select>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{background:"#FFF",borderRadius:14,padding:14,border:"1px solid #EDE6DE"}}>
          <div style={{fontSize:15,fontWeight:800,color:"#2D1B0E",marginBottom:12}}>Appliquer à {MONTHS_FR[month]} {year}</div>
          <button onClick={()=>showConfirm(`Compléter les jours vides de ${MONTHS_FR[month]} avec le modèle ?`,()=>applyTemplate(false))}
            style={{width:"100%",padding:14,borderRadius:12,border:"none",background:"#2D1B0E",color:"#FFF",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:8}}
          >Remplir les jours vides</button>
          <button onClick={()=>showConfirm(`Remplacer TOUT le planning de ${MONTHS_FR[month]} ? Les assignations existantes seront perdues.`,()=>applyTemplate(true))}
            style={{width:"100%",padding:14,borderRadius:12,border:"none",background:"#FFF0F0",color:"#D93025",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}
          >Tout remplacer par le modèle</button>
        </div>
      </div>
    );
  };

  // ════════════════════════════════════════════════════════
  //  BOTTOM SHEET
  // ════════════════════════════════════════════════════════
  const BottomSheet = () => {
    if (selDay===null) return null;
    const assignee = planning[selDay]; const p = assignee?personFor(assignee):null;
    const dayIn    = indispo[selDay]||[];
    const hasEx    = exchanges.some(e=>e.day===selDay&&e.month===month&&e.year===year&&e.status==="open");
    return (
      <>
        <div onClick={()=>setSheetOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:100,opacity:sheetOpen?1:0,pointerEvents:sheetOpen?"all":"none",transition:"opacity 0.25s"}}/>
        <div role="dialog" aria-modal="true"
          style={{position:"fixed",bottom:0,left:"50%",transform:`translateX(-50%) translateY(${sheetOpen?"0":"110%"})`,width:"100%",maxWidth:480,background:"#FFF",borderRadius:"22px 22px 0 0",zIndex:101,transition:"transform 0.32s cubic-bezier(0.32,0.72,0,1)",maxHeight:"88vh",overflowY:"auto"}}
        >
          <div style={{width:40,height:4,background:"#DDD",borderRadius:2,margin:"12px auto 0"}}/>
          <div style={{padding:"14px 16px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:19,fontWeight:900,color:"#2D1B0E"}}>{fullDate(selDay,month,year)}</span>
            <button onClick={()=>setSheetOpen(false)} aria-label="Fermer"
              style={{background:"#F0EBE5",border:"none",borderRadius:"50%",width:34,height:34,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#666",fontFamily:"inherit"}}
            >✕</button>
          </div>

          {/* Assignation actuelle */}
          <div style={{padding:"14px 16px 0"}}>
            {assignee&&p
              ? <div style={{display:"flex",alignItems:"center",gap:10,background:p.bg,borderRadius:12,padding:"12px 14px",border:`2px solid ${p.color}`}}>
                  <div style={{width:18,height:18,borderRadius:"50%",background:p.color}}/>
                  <span style={{fontSize:16,fontWeight:800,color:"#2D1B0E",flex:1}}>Gardien·ne : {assignee}</span>
                  {hasEx&&<span style={{fontSize:12,color:"#B08A10",fontWeight:700,background:"#F8F3E8",borderRadius:8,padding:"3px 8px"}}>🔄 Échange ouvert</span>}
                </div>
              : <div style={{background:"#F5EDE5",borderRadius:12,padding:"12px 14px",fontSize:15,color:"#AAA",fontWeight:600}}>Personne n'est assigné pour ce jour</div>
            }
          </div>

          {/* Qui garde ? */}
          <div style={{padding:"16px 16px 0"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#BBB",letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Qui garde Maman ce jour ?</div>
            {PEOPLE.map(pe=>(
              <button key={pe.name} onClick={()=>assignDay(selDay,pe.name)} aria-pressed={assignee===pe.name}
                style={{display:"flex",alignItems:"center",gap:10,padding:"13px 14px",borderRadius:12,marginBottom:6,border:`2px solid ${assignee===pe.name?pe.color:"transparent"}`,background:assignee===pe.name?pe.bg:"#F5EDE5",cursor:"pointer",width:"100%",textAlign:"left",fontFamily:"inherit",transition:"all 0.15s"}}
              >
                <div style={{width:16,height:16,borderRadius:"50%",background:pe.color,flexShrink:0}}/>
                <span style={{fontSize:16,fontWeight:700,color:"#2D1B0E",flex:1}}>{pe.name}</span>
                <span style={{fontSize:12,color:"#BBB"}}>{pe.role}</span>
                {assignee===pe.name&&<span style={{color:pe.color,fontWeight:800}}>✓</span>}
              </button>
            ))}
          </div>

          {/* Indisponibilités */}
          <div style={{padding:"14px 16px 0"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#BBB",letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Indisponibilités</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
              {PEOPLE.map(pe=>{
                const act = dayIn.includes(pe.name);
                return (
                  <button key={pe.name} onClick={()=>toggleIndispo(selDay,pe.name)} aria-pressed={act}
                    style={{padding:"9px 13px",borderRadius:20,border:`1.5px solid ${act?pe.color:"#DDD"}`,background:act?pe.color+"20":"#F5EDE5",color:act?pe.color:"#777",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}
                  >{act?"✕ ":""}{pe.name}</button>
                );
              })}
            </div>
          </div>

          {/* Actions */}
          <div style={{padding:"14px 16px 0"}}>
            {assignee&&!hasEx&&(
              <button onClick={()=>proposeExchange(selDay)}
                style={{width:"100%",padding:14,borderRadius:12,border:"none",background:"#F0EBE5",color:"#444",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:8}}
              >🔄 Proposer un échange</button>
            )}
            {assignee&&(
              <button onClick={()=>showConfirm(`Effacer l'assignation de ${assignee} du ${fullDate(selDay,month,year)} ?`,()=>{clearDay(selDay);setSheetOpen(false);})}
                style={{width:"100%",padding:14,borderRadius:12,border:"none",background:"#FFF0F0",color:"#D93025",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}
              >🗑 Effacer l'assignation</button>
            )}
          </div>
          <div style={{height:32}}/>
        </div>
      </>
    );
  };

  // ════════════════════════════════════════════════════════
  //  RENDU PRINCIPAL
  // ════════════════════════════════════════════════════════
  const TABS = [
    {id:"calendar", label:"Calendrier",  icon:"📅"},
    {id:"stats",    label:"Répartition", icon:"📊"},
    {id:"exchanges",label:"Échanges",    icon:"🔄"},
    {id:"template", label:"Modèle",      icon:"⚙️"},
  ];
  const openExCount = exchanges.filter(e=>e.status==="open").length;

  return (
    <div style={{fontFamily:"'Nunito',sans-serif",background:"#FFF8F3",minHeight:"100vh",maxWidth:480,margin:"0 auto",position:"relative",paddingBottom:80}}>

      {/* Header */}
      <div style={{background:"#FFF",borderBottom:"1px solid #EDE6DE",padding:"12px 16px 10px",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <h1 style={{fontSize:22,fontWeight:900,color:"#2D1B0E"}}>🌸 Planning Maman</h1>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            {!USE_FIREBASE && <span style={{fontSize:11,color:"#FFF",background:"#E07A4F",borderRadius:8,padding:"2px 7px",fontWeight:700}}>LOCAL</span>}
            {syncing && <span style={{fontSize:16,color:"#CCC",display:"inline-block",animation:"spin 1s linear infinite"}}>⟳</span>}
            {lastSync && <span style={{fontSize:12,color:"#BBB"}}>{lastSync.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span>}
          </div>
        </div>
        {view!=="exchanges" && (
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:10}}>
            <button onClick={prevMonth} aria-label="Mois précédent" style={{background:"#F5EDE5",border:"none",borderRadius:10,padding:"8px 16px",fontSize:18,cursor:"pointer",fontWeight:700,color:"#555",fontFamily:"inherit"}}>‹</button>
            <span style={{fontSize:18,fontWeight:800,color:"#2D1B0E"}}>{MONTHS_FR[month]} {year}</span>
            <button onClick={nextMonth} aria-label="Mois suivant" style={{background:"#F5EDE5",border:"none",borderRadius:10,padding:"8px 16px",fontSize:18,cursor:"pointer",fontWeight:700,color:"#555",fontFamily:"inherit"}}>›</button>
          </div>
        )}
      </div>

      {/* Contenu */}
      {view==="calendar"  && <CalendarView/>}
      {view==="stats"     && <StatsView/>}
      {view==="exchanges" && <ExchangesView/>}
      {view==="template"  && <TemplateView/>}

      {/* Bottom Sheet */}
      <BottomSheet/>

      {/* Toast */}
      {toast && (
        <div className="toast-in" role="alert" aria-live="polite"
          style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:toast.type==="error"?"#D93025":toast.type==="info"?"#555":"#2BA06A",color:"#FFF",padding:"13px 22px",borderRadius:14,fontSize:15,fontWeight:700,zIndex:999,whiteSpace:"nowrap",boxShadow:"0 4px 24px rgba(0,0,0,0.25)",fontFamily:"inherit"}}
        >{toast.msg}</div>
      )}

      {/* Dialog confirmation */}
      {confirm && (
        <div role="dialog" aria-modal="true"
          style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}
        >
          <div style={{background:"#FFF",borderRadius:22,padding:24,width:"100%",maxWidth:340,textAlign:"center"}}>
            <div style={{fontSize:42,marginBottom:12}}>⚠️</div>
            <div style={{fontSize:17,fontWeight:700,color:"#2D1B0E",lineHeight:1.5,marginBottom:22}}>{confirm.msg}</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setConfirm(null)} style={{flex:1,padding:14,borderRadius:12,border:"none",background:"#F0EBE5",color:"#444",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Annuler</button>
              <button onClick={()=>{confirm.fn();setConfirm(null);}} style={{flex:1,padding:14,borderRadius:12,border:"none",background:"#D93025",color:"#FFF",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Confirmer</button>
            </div>
          </div>
        </div>
      )}

      {/* Navigation bas */}
      <nav style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#FFF",borderTop:"1px solid #EDE6DE",display:"flex",zIndex:20}}>
        {TABS.map(tab=>{
          const active = view===tab.id;
          return (
            <button key={tab.id} onClick={()=>setView(tab.id)} aria-label={tab.label} aria-current={active?"page":undefined}
              style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"8px 4px 14px",cursor:"pointer",border:"none",background:"none",fontFamily:"inherit",gap:3,position:"relative"}}
            >
              <span style={{fontSize:22,lineHeight:1,position:"relative"}}>
                {tab.icon}
                {tab.id==="exchanges"&&openExCount>0&&(
                  <span style={{position:"absolute",top:-4,right:-8,background:"#D93025",color:"#FFF",borderRadius:"50%",width:17,height:17,fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontFamily:"inherit"}}>{openExCount}</span>
                )}
              </span>
              <span style={{fontSize:11,fontWeight:active?800:500,color:active?"#E07A4F":"#BBB"}}>{tab.label}</span>
              {active&&<div style={{position:"absolute",bottom:0,left:"25%",right:"25%",height:3,background:"#E07A4F",borderRadius:"2px 2px 0 0"}}/>}
            </button>
          );
        })}
      </nav>
    </div>
  );
}

// Montage React 18
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script>
</body>
</html>
